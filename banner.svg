<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Mariano Fernández Blanco · Analista de Sistemas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1f2a3d"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="typing">
      <rect x="60" y="160" height="40" width="0">
        <animate attributeName="width" from="0" to="470" dur="3s" begin="0.4s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="260" rx="14" fill="url(#bg)"/>
  <rect width="900" height="260" rx="14" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="899" height="259" rx="13.5" fill="none" stroke="#1f2a3d"/>

  <!-- Monograma -->
  <circle cx="765" cy="130" r="110" fill="url(#glow)"/>
  <g transform="translate(765 130)">
    <rect x="-62" y="-62" width="124" height="124" rx="26" fill="#0d1117" stroke="url(#accent)" stroke-width="3" transform="rotate(8)"/>
    <rect x="-62" y="-62" width="124" height="124" rx="26" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1" transform="rotate(-6)"/>
    <text x="0" y="14" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="url(#accent)" letter-spacing="1">MFB</text>
  </g>

  <!-- Texto -->
  <text x="60" y="78" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" letter-spacing="4" fill="#22d3ee">ANALISTA DE SISTEMAS · BUENOS AIRES, AR</text>
  <rect x="60" y="92" width="64" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="60" y="142" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#e6edf3">Mariano Fernández Blanco</text>

  <!-- Línea con efecto de tipeo -->
  <g clip-path="url(#typing)">
    <text x="60" y="185" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="18" fill="#8b98a9">Python · FastAPI · Flask · SQL Server · IA</text>
  </g>
  <rect x="60" y="169" width="9" height="22" fill="#22d3ee">
    <animate attributeName="x" from="60" to="520" dur="3s" begin="0.4s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="3.4s" repeatCount="indefinite"/>
  </rect>
</svg>
